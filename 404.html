
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0A0A">
  <title>Page Not Found | Beyond Movement</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 25px;
      background: #0A0A0A;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .content { max-width: 550px; }

    h1 {
      margin: 0;
      color: #FF3B1F;
      font-size: clamp(6rem, 20vw, 11rem);
      line-height: 1;
    }

    h2 {
      font-size: 1.5rem;
      margin: 15px 0;
    }

    p {
      color: #999;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 22px;
      background: #FF3B1F;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="content">
    <h1>404</h1>
    <h2>YOU'VE GONE BEYOND THE PAGE.</h2>
    <p>
      The page you're looking for doesn't exist
      or may have moved.
    </p>
    <a href="/">RETURN HOME ↗</a>
  </main>
</body>
</html>
